name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Fast parallel Linux tests on self-hosted runners
  test-linux-unit:
    runs-on: [self-hosted, linux]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Verify BATS installation
      run: |
        if [[ ! -f tests/bats/bin/bats ]]; then
          git submodule update --init --recursive
        fi
        tests/bats/bin/bats --version

    - name: Run unit tests
      run: |
        cd tests
        ./run_tests.sh --unit-only

  test-linux-integration:
    runs-on: [self-hosted, linux]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Verify BATS installation
      run: |
        if [[ ! -f tests/bats/bin/bats ]]; then
          git submodule update --init --recursive
        fi
        tests/bats/bin/bats --version

    - name: Run integration tests
      run: |
        cd tests
        ./run_tests.sh --integration-only

  test-linux-system:
    runs-on: [self-hosted, linux]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Verify BATS installation
      run: |
        if [[ ! -f tests/bats/bin/bats ]]; then
          git submodule update --init --recursive
        fi
        tests/bats/bin/bats --version

    - name: Run system tests
      run: |
        cd tests
        ./run_tests.sh --system-only

    - name: Test installation script
      run: |
        export INSTALL_DIR="$GITHUB_WORKSPACE/test-install"
        mkdir -p "$INSTALL_DIR"
        sed 's|/usr/local/bin|'"$INSTALL_DIR"'|g' install.sh > test-install.sh
        chmod +x test-install.sh
        ./test-install.sh --offline ./llm-env
        test -x "$INSTALL_DIR/llm-env"
        "$INSTALL_DIR/llm-env" --version

  # macOS tests on GitHub-hosted runners (need actual macOS).
  #
  # This used to carry a `strategy.matrix.shell: [bash, zsh]` which bought
  # nothing: bats is #!/usr/bin/env bash and has no $SHELL reference anywhere
  # in libexec, so both legs ran a byte-identical bash suite at 2x the cost.
  # Real zsh coverage comes from the dedicated step below, which spawns zsh
  # explicitly -- and macOS is also where /bin/bash is genuinely 3.2.
  test-macos:
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up shell environment
      run: |
        # Install newer bash on macOS (default is 3.2.57)
        brew install bash || true
        echo "/opt/homebrew/bin" >> $GITHUB_PATH


    - name: Debug environment information
      run: |
        echo "=== Environment Debug Information ==="
        echo "Default bash version: $BASH_VERSION"
        echo "System bash: $(/bin/bash --version | head -1)"
        echo "zsh: $(zsh --version 2>/dev/null || echo 'not installed')"

        if [[ -x "/opt/homebrew/bin/bash" ]]; then
          echo "Homebrew bash version: $(/opt/homebrew/bin/bash --version | head -1)"
        fi

    - name: Verify BATS installation
      run: |
        if [[ ! -f tests/bats/bin/bats ]]; then
          git submodule update --init --recursive
        fi
        tests/bats/bin/bats --version

    - name: Run unit tests
      run: |
        cd tests
        ./run_tests.sh --unit-only

    - name: Run integration tests
      run: |
        cd tests
        ./run_tests.sh --integration-only

    - name: Run system tests
      run: |
        cd tests
        ./run_tests.sh --system-only

    # Genuine zsh coverage: these spawn `zsh -f` and execute the SUT under it.
    # macOS is the platform whose users default to zsh, so this is where it
    # matters most.
    - name: Run zsh support tests
      run: tests/bats/bin/bats tests/system/test_zsh_support.bats

    # macOS ships bash 3.2.57 as /bin/bash -- the oldest supported interpreter
    # and the only place it can be tested for real rather than simulated.
    - name: Verify the script runs under real bash 3.2
      run: |
        /bin/bash --version | head -1
        /bin/bash -c "source ./llm-env --version"
        /bin/bash -c "source ./llm-env list" >/dev/null

    - name: Test installation script
      run: |
        export INSTALL_DIR="$GITHUB_WORKSPACE/test-install"
        mkdir -p "$INSTALL_DIR"
        bash install.sh --offline ./llm-env --install-dir "$INSTALL_DIR"
        test -f "$INSTALL_DIR/llm-env"
        test -f "$INSTALL_DIR/quickstart-synthetic.json"
        bash -c "source '$INSTALL_DIR/llm-env' --version"

  lint:
    runs-on: [self-hosted, linux]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install ShellCheck
      run: |
        if ! command -v shellcheck &> /dev/null; then
          sudo apt-get update
          sudo apt-get install -y shellcheck
        fi

    # Discover every shell file rather than naming three. The previous form
    # left tests/lib/bats_helpers.sh, tests/coverage.sh and the system runners
    # unlinted -- which is how a `local -n` (bash 4.3+) landed in the helper
    # whose whole purpose is exercising the bash-3.2 path.
    # .bats files are excluded: `@test "..." {` is not valid sh and produces
    # only noise.
    - name: Run ShellCheck
      run: |
        mapfile -t files < <(git ls-files '*.sh' '*.bash')
        files+=(llm-env)
        printf 'linting %d files\n' "${#files[@]}"
        shellcheck --shell=bash "${files[@]}"

  # Guard the LF invariant that Windows support depends on. A CRLF checkout
  # makes `source llm-env` die on its first line and makes run_tests.sh die on
  # its own heredoc terminator, so this must fail loudly rather than surface as
  # a confusing downstream error.
  crlf-guard:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Assert no CR in shell-parsed files
      run: |
        bad=0
        while IFS= read -r f; do
          [ -f "$f" ] || continue
          if grep -qU $'\r' "$f"; then
            echo "::error file=$f::contains a carriage return"
            bad=1
          fi
        done < <(git ls-files 'llm-env' '*.sh' '*.bash' '*.bats' '*.conf' '*.json' '*.yml')
        exit "$bad"

    - name: Assert .gitattributes pins eol=lf
      run: grep -q 'eol=lf' .gitattributes

  # Windows support via Git Bash (MSYS2). Required: the platform layer,
  # CRLF handling and rc-file selection are all exercised here.
  test-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
    # MUST precede checkout. Git for Windows defaults to core.autocrlf=true;
    # without this the working tree lands CRLF and run_tests.sh dies before a
    # single test runs (its `cat << 'EOF'` terminator becomes "EOF\r").
    # `git config --global` needs no repository, so it is safe here.
    - name: Force an LF checkout
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Assert the checkout really is LF
      run: |
        for f in llm-env install.sh tests/run_tests.sh tests/bats/bin/bats; do
          if grep -qU $'\r' "$f"; then echo "CRLF in $f"; exit 1; fi
        done
        tests/bats/bin/bats --version

    - name: Environment probe
      run: |
        uname -s
        echo "BASH_VERSION=$BASH_VERSION"
        for c in bc free awk sed curl wget zsh; do
          if command -v "$c" >/dev/null 2>&1; then echo "have $c"; else echo "MISSING $c"; fi
        done

    - name: Run unit tests
      run: bash tests/run_tests.sh --unit-only

    # Diagnostic: run the installer standalone with the same sanitized PATH
    # test_install.bats uses, and show everything. bats does not echo captured
    # output, and the installer has been exiting 1 with an empty capture on
    # this platform only.
    - name: Installer diagnostic (does not fail the job)
      continue-on-error: true
      run: |
        set +e
        mkdir -p "$RUNNER_TEMP/diag/bin" "$RUNNER_TEMP/diag/home"
        echo "--- with the suite's sanitized PATH ---"
        env -i HOME="$RUNNER_TEMP/diag/home" PATH="/usr/bin:/bin" \
            LLM_ENV_DEFAULT_INSTALL_DIR="$RUNNER_TEMP/diag/bin" \
            bash ./install.sh --offline ./llm-env --install-dir "$RUNNER_TEMP/diag/bin" 2>&1 | head -40
        echo "exit=${PIPESTATUS[0]}"
        echo "--- with the full PATH ---"
        bash ./install.sh --offline ./llm-env --install-dir "$RUNNER_TEMP/diag/bin2" 2>&1 | head -40
        echo "exit=${PIPESTATUS[0]}"
        echo "--- tool availability on the sanitized PATH ---"
        env PATH="/usr/bin:/bin" bash -c 'for c in bash cp mkdir mv chmod curl dirname sed grep; do
          command -v "$c" >/dev/null 2>&1 && echo "have $c" || echo "MISSING $c"; done'

    - name: Run integration tests
      run: bash tests/run_tests.sh --integration-only

    - name: Run platform tests
      run: tests/bats/bin/bats tests/unit/test_platform.bats

    - name: Install smoke test (asserts runtime assets ship)
      run: |
        export INSTALL_DIR="$GITHUB_WORKSPACE/test-install"
        mkdir -p "$INSTALL_DIR"
        bash install.sh --offline ./llm-env --install-dir "$INSTALL_DIR"
        test -f "$INSTALL_DIR/llm-env"
        # quickstart must work immediately after install -- it did not before,
        # because only the llm-env script itself was ever installed.
        test -f "$INSTALL_DIR/quickstart-synthetic.json"
        test -f "$INSTALL_DIR/config/llm-env.conf"
        bash -c "source '$INSTALL_DIR/llm-env' --version"
        bash -c "source '$INSTALL_DIR/llm-env' quickstart all" </dev/null

  scraper-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r scripts/requirements.txt

    - name: Run scraper unit tests
      run: python -m pytest scripts/tests/ -v --cov=scripts.lib --cov=scripts.update_quickstart --cov-report=term

  security:
    runs-on: [self-hosted, linux]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check for secrets in code
      run: |
        if grep -r -E "(api[_-]key|API[_-]KEY)\s*=\s*['\"][a-zA-Z0-9_-]{20,}['\"]" . --exclude-dir=.git --exclude-dir=tests --exclude="*.md" --exclude-dir=examples; then
          echo "WARNING: Potential API keys found in code"
          exit 1
        fi

    - name: Check file permissions
      run: |
        find . -type f \( -perm -002 -o -perm -020 \) -not -path "./.git/*" | head -10

    - name: Validate configuration files
      run: |
        if [[ -f config/llm-env.conf ]]; then
          if ! grep -q "^\[.*\]$" config/llm-env.conf; then
            echo "ERROR: Invalid configuration file format"
            exit 1
          fi
        fi

  # Line-coverage floor gate for the llm-env script.
  # kcov is not packaged in modern Ubuntu apt repos, so build it from source
  # (the persistent self-hosted runner keeps the built binary, so the guard
  # skips the build on subsequent runs). The gate is a realistic floor, not an
  # aspirational target: measured coverage is 58.15% as of 1.7.0, so 55% guards
  # against regressions with a little headroom. docs/technical-debt.md records
  # what the remaining ~42% is and why it is not cheaply reachable -- notably
  # that tests/system/ exercises the SUT but is excluded from this measurement.
  coverage:
    runs-on: [self-hosted, linux]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install kcov (build from source if absent)
      run: |
        if ! command -v kcov &> /dev/null; then
          sudo apt-get update
          sudo apt-get install -y binutils-dev libcurl4-openssl-dev libdw-dev \
            libiberty-dev cmake g++ zlib1g-dev libssl-dev
          rm -rf /tmp/kcov-src
          git clone --depth 1 https://github.com/SimonKagstrom/kcov /tmp/kcov-src
          mkdir -p /tmp/kcov-src/build && cd /tmp/kcov-src/build
          cmake .. && make -j"$(nproc)" && sudo make install
        fi
        kcov --version

    - name: Verify BATS installation
      run: |
        if [[ ! -f tests/bats/bin/bats ]]; then
          git submodule update --init --recursive
        fi
        tests/bats/bin/bats --version

    - name: "Measure coverage (floor 55 percent)"
      run: |
        chmod +x tests/coverage.sh
        COVERAGE_MIN=55 tests/coverage.sh all
